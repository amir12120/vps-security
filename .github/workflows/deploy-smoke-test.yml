name: Deploy Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Deploy Smoke Test (stubbed install + monitor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check (all scripts)
        run: |
          fail=0
          for f in install.sh vpssec lib/*.sh scripts/*.sh test/*.sh; do
            if bash -n "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "all scripts pass bash -n"

      - name: ShellCheck (non-blocking)
        continue-on-error: true
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: test

      - name: Run smoke test suite
        run: |
          chmod +x vpssec lib/*.sh test/*.sh scripts/*.sh
          bash test/smoke.sh

      - name: Run two-host tunnel simulation (Iran + foreign, panel + backpack)
        run: |
          bash test/simulate-two-host.sh

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/*.txt
            /tmp/*.out
            /tmp/tmp.*/*.out
          if-no-files-found: ignore
